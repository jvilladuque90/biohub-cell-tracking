<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .caja { fill: #f4f6fa; stroke: #4a6fa5; stroke-width: 1.4; rx: 6; }
    .modelo { fill: #e3efd9; stroke: #4c8a3f; stroke-width: 1.6; rx: 6; }
    .const { fill: #fdeede; stroke: #c0682b; stroke-width: 1.4; rx: 6; }
    .titulo { font-weight: bold; font-size: 13px; fill: #1c2b45; }
    .txt { fill: #333; }
    .nota { fill: #7a4a1e; font-style: italic; font-size: 11px; }
    .flujo { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#flecha); }
    .ley { font-size: 11px; fill: #333; }
  </style>

  <!-- entrada -->
  <rect x="20" y="20" width="200" height="58" class="caja"/>
  <text x="120" y="42" text-anchor="middle" class="titulo">3D volume + time</text>
  <text x="120" y="60" text-anchor="middle" class="txt">100 frames x (Z, Y, X) uint16</text>
  <text x="120" y="73" text-anchor="middle" class="txt">voxel 1.625 x 0.406 x 0.406 um</text>

  <!-- capa 1: deteccion (modelo) -->
  <rect x="20" y="110" width="200" height="118" class="modelo"/>
  <text x="120" y="130" text-anchor="middle" class="titulo">1. Detection (temporal 3D U-Net)</text>
  <text x="30" y="150" class="txt">per-voxel centre heatmap</text>
  <text x="30" y="165" class="txt">2-frame window, ~2 M parameters</text>
  <text x="30" y="180" class="txt">+ 2nd seed + flips (TTA)</text>
  <text x="30" y="195" class="nota">threshold 0.965, minimum distance,</text>
  <text x="30" y="210" class="nota">retention guard 0.90, DeepCenter rescue</text>

  <!-- capa 2: rasgos -->
  <rect x="20" y="260" width="200" height="60" class="caja"/>
  <text x="120" y="280" text-anchor="middle" class="titulo">2. Per-cell descriptor</text>
  <text x="120" y="298" text-anchor="middle" class="txt">U-Net feature vector at its position</text>
  <text x="120" y="312" text-anchor="middle" class="txt">+ coordinates (t, z, y, x)</text>

  <!-- capa 3: aristas (modelo) -->
  <rect x="260" y="110" width="220" height="118" class="modelo"/>
  <text x="370" y="130" text-anchor="middle" class="titulo">3. Link probability (MY MODEL)</text>
  <text x="270" y="150" class="txt">node transformer: every cell at t</text>
  <text x="270" y="165" class="txt">vs every cell at t+1 (5-frame window)</text>
  <text x="270" y="180" class="txt">softmax per target + 'no parent' row</text>
  <text x="270" y="195" class="nota">reverse fusion (0.15), 2nd-seed consensus,</text>
  <text x="270" y="210" class="nota">prune p &gt; 0.48 (dominance rule)</text>

  <!-- capa 4: ILP -->
  <rect x="260" y="260" width="220" height="60" class="caja"/>
  <text x="370" y="280" text-anchor="middle" class="titulo">4. Global linking (ILP, SCIP)</text>
  <text x="370" y="298" text-anchor="middle" class="txt">max sum of p; 1 parent, &lt;= 2 children</text>
  <text x="370" y="312" text-anchor="middle" class="nota">track start/end and division costs</text>

  <!-- capa 5: reparacion (constantes) -->
  <rect x="520" y="20" width="430" height="300" class="const"/>
  <text x="735" y="42" text-anchor="middle" class="titulo">5. Graph repair (93 hand-tuned constants)</text>
  <text x="530" y="66" class="txt">5.1 filter: drop edges &gt; 14 um or skipping frames</text>
  <text x="530" y="88" class="txt">5.2 motion relink: kinematic prediction + Hungarian,</text>
  <text x="530" y="102" class="txt">      6 um tight, 10 um relaxed, bonus 1.0 x p</text>
  <text x="530" y="124" class="txt">5.3 gap closing: 5 um (density-corrected); 2 frames</text>
  <text x="530" y="138" class="txt">      with a synthetic node, DeepCenter veto</text>
  <text x="530" y="160" class="txt">5.4 safe divisions: mother-daughter &lt;= 9 um, sisters &lt;= 14 um,</text>
  <text x="530" y="174" class="txt">      symmetry 0.6, DeepCenter veto</text>
  <text x="530" y="196" class="txt">5.5 HOCT consensus veto: removes ~0.4 % of edges</text>
  <text x="530" y="218" class="txt">5.6 short-track filter: min 6 cells (+ adaptive rescue)</text>
  <text x="530" y="240" class="txt">5.7 smoothing: local line fit (window 2, weight 0.8)</text>
  <text x="530" y="270" class="nota">each constant encodes information the model does not receive:</text>
  <text x="530" y="285" class="nota">motion (5.2), 2-frame gaps (5.3), mitosis morphology (5.4),</text>
  <text x="530" y="300" class="nota">which detections are noise (5.6)</text>

  <!-- salida -->
  <rect x="520" y="360" width="200" height="60" class="caja"/>
  <text x="620" y="380" text-anchor="middle" class="titulo">6. submission.csv</text>
  <text x="620" y="398" text-anchor="middle" class="txt">cells (id, t, z, y, x)</text>
  <text x="620" y="412" text-anchor="middle" class="txt">+ parent -&gt; child edges</text>

  <!-- metrica -->
  <rect x="750" y="360" width="200" height="60" class="caja"/>
  <text x="850" y="380" text-anchor="middle" class="titulo">Metric</text>
  <text x="850" y="398" text-anchor="middle" class="txt">edge Jaccard x (1 - 0.1 excess)</text>
  <text x="850" y="412" text-anchor="middle" class="txt">+ 0.1 x division Jaccard</text>

  <!-- flujo -->
  <path d="M120,78 L120,110" class="flujo"/>
  <path d="M120,228 L120,260" class="flujo"/>
  <path d="M220,290 L240,290 L240,169 L260,169" class="flujo"/>
  <path d="M370,228 L370,260" class="flujo"/>
  <path d="M480,290 L500,290 L500,170 L520,170" class="flujo"/>
  <path d="M735,320 L735,340 L620,340 L620,360" class="flujo"/>
  <path d="M720,390 L750,390" class="flujo"/>

  <!-- leyenda -->
  <rect x="20" y="470" width="14" height="14" class="modelo"/>
  <text x="40" y="482" class="ley">learned model (organizer weights 402 epochs, public 2nd seed, my edge model)</text>
  <rect x="20" y="495" width="14" height="14" class="caja"/>
  <text x="40" y="507" class="ley">fixed computation (features, optimizer, output, metric)</text>
  <rect x="20" y="520" width="14" height="14" class="const"/>
  <text x="40" y="532" class="ley">hand-tuned post-processing (public notebook)</text>
  <text x="520" y="482" class="ley">Final submission: step 3 is my retrained edge model (5-frame window,</text>
  <text x="520" y="497" class="ley">8 physical features, score-aligned loss): private LB 0.915 vs 0.912.</text>
  <text x="520" y="520" class="ley"></text>
  <text x="520" y="535" class="ley"></text>
</svg>
